    <!-- Apply the theme before first paint: a saved choice wins, otherwise follow the device setting.
         Key must match src/hooks/useTheme.ts -->

      try {
        var saved = localStorage.getItem("royalgrip-theme");
        if (saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
